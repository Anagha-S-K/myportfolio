<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anagha</title>
    <meta name="description" content="Anagha S K, AI Engineer at Techcrafter, Bengaluru. Building computer-vision solutions for factory floors." />
    <meta name="theme-color" content="#EFF6EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131824" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anagha S K · AI Engineer" />
    <meta property="og:description" content="AI Engineer at Techcrafter, Bengaluru. Building computer-vision solutions for factory floors." />
    <!-- after deploying, change this to the full address, e.g. https://your-site.vercel.app/og-image.png -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // dark is the default; a saved choice (from the toggle) wins
      var theme = 'dark';
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') theme = t; } catch (e) {}
      document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
